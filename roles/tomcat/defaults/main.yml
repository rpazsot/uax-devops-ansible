---
tomcat_archive_url: https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_ver }}/bin/apache-tomcat-{{ tomcat_ver }}.tar.gz
tomcat_archive_dest: /opt/apache-tomcat-{{ tomcat_ver }}.tar.gz
tomcat_install_path: /opt/tomcat
# Control de despliegue
deploy_artifact: false
# Variables de Artifactory (se sobrescriben desde Jenkins)
war_from_artifactory_url: ""
app_name: "web-app"
# Rutas por defecto (se pueden ajustar por SO en las tasks)
tomcat_webapps_path: "/opt/tomcat/webapps"
